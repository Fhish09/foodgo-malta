<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — FoodGo Malta</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #120D0A; --bg-card: #1E160F; --gold: #C9975A; --gold-light: #E8B778;
      --text: #F5EFE6; --text-body: #B5AB9E; --text-muted: #8A8078;
      --border: rgba(201,151,90,0.25); --error: #e07070;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif;
      background-image: radial-gradient(ellipse at 50% 0%, rgba(201,151,90,0.12), transparent 55%);
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--bg-card);
      border: 1px solid var(--border); border-radius: 20px; padding: 36px 32px;
    }
    .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .logo span { color: var(--gold); }
    .sub { text-align: center; color: var(--text-body); font-size: 0.9rem; margin-bottom: 28px; }
    label { display: block; font-size: 0.78rem; color: var(--text-muted); margin-bottom: 6px; }
    input {
      width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--border);
      background: rgba(18,13,10,0.6); color: var(--text); padding: 0 14px; margin-bottom: 16px; font-family: inherit;
    }
    .btn {
      width: 100%; height: 46px; border: none; border-radius: 999px;
      background: var(--gold); color: #14100C; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 8px;
    }
    .btn:disabled { opacity: 0.6; }
    .error {
      display: none; background: rgba(224,112,112,0.12); border: 1px solid rgba(224,112,112,0.35);
      color: var(--error); padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 16px;
    }
    .error.show { display: block; }
    .foot { text-align: center; margin-top: 20px; font-size: 0.85rem; color: var(--text-muted); }
    .foot a { color: var(--gold); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Food<span>Go</span> Malta</div>
    <p class="sub">Sign in to continue</p>
    <div class="error" id="error"></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required placeholder="admin@foodgo.mt" />
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required />
      <button class="btn" type="submit" id="submitBtn">Sign in</button>
    </form>
    <p class="foot">New here? <a href="register.html">Create an account</a></p>
  </div>
  <script>
    var API = (location.port === '8080')
      ? '/api'
      : (location.protocol + '//' + (location.hostname || 'localhost') + ':4000/api');

    function goByRole(user) {
      if (user && user.role === 'admin') {
        window.location.replace('admin.html');
      } else if (user && user.role === 'driver') {
        window.location.replace('driver.html');
      } else {
        window.location.replace('index.html');
      }
    }

    if (localStorage.getItem('foodgo_token')) {
      try {
        goByRole(JSON.parse(localStorage.getItem('foodgo_user') || '{}'));
      } catch (e) {
        window.location.replace('index.html');
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
      e.preventDefault();
      var err = document.getElementById('error');
      var btn = document.getElementById('submitBtn');
      err.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      try {
        var res = await fetch(API + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          })
        });
        var data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');
        localStorage.setItem('foodgo_token', data.token);
        localStorage.setItem('foodgo_user', JSON.stringify(data.user));
        goByRole(data.user);
      } catch (ex) {
        err.textContent = ex.message;
        err.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Sign in';
      }
    });
  </script>
</body>
</html>
