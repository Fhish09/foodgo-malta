<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FoodGo Malta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-card: #141414;
      --gold: #c9a227;
      --gold-light: #e0b84a;
      --text: #f5f0e6;
      --text-muted: #9a948a;
      --border: rgba(201,162,39,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 78px;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3 { font-family: 'Cormorant Garamond', Georgia, serif; }

    /* Header */
    header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 40;
      padding: 16px 18px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem; font-weight: 700; letter-spacing: 1px;
    }
    .logo span { color: var(--gold); }
    .header-right { display: flex; gap: 8px; align-items: center; }
    .h-btn {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text); height: 34px; padding: 0 14px;
      border-radius: 20px; font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.4px; text-transform: uppercase; cursor: pointer;
    }

    /* ===== HERO - split style like reference ===== */
    .hero {
      display: grid;
      grid-template-columns: 1fr;
      min-height: 520px;
      position: relative;
      background: #0a0a0a;
    }
    .hero-left {
      padding: 90px 22px 28px;
      display: flex; flex-direction: column; justify-content: center;
      z-index: 2;
    }
    .hero-left h1 {
      font-size: 2.2rem; font-weight: 600; font-style: italic;
      line-height: 1.15; margin-bottom: 14px;
    }
    .hero-left p {
      font-size: 0.86rem; color: var(--text-muted);
      line-height: 1.6; margin-bottom: 24px; max-width: 280px;
    }
    .btn-gold {
      display: inline-block;
      background: var(--gold); color: #0a0a0a;
      border: none; padding: 12px 26px;
      font-size: 0.78rem; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; cursor: pointer;
      border-radius: 3px; transition: background 0.2s;
      font-family: 'Outfit', sans-serif;
      align-self: flex-start;
    }
    .btn-gold:hover { background: var(--gold-light); }

    .hero-right {
      height: 280px;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .hero-right::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 40%, #0a0a0a 100%);
    }

    /* ===== FEATURED - image left, text right (steak section) ===== */
    .featured {
      padding: 36px 20px;
      display: grid;
      gap: 20px;
    }
    .feat-img {
      height: 240px;
      border-radius: 8px;
      background-size: cover;
      background-position: center;
    }
    .feat-text h2 {
      font-size: 1.5rem; font-weight: 600; font-style: italic;
      margin-bottom: 10px; line-height: 1.2;
    }
    .feat-text p {
      font-size: 0.84rem; color: var(--text-muted);
      line-height: 1.65; margin-bottom: 18px;
    }
    .btn-outline {
      display: inline-block;
      background: transparent; color: var(--gold);
      border: 1px solid var(--gold); padding: 10px 22px;
      font-size: 0.75rem; font-weight: 500; letter-spacing: 0.8px;
      text-transform: uppercase; cursor: pointer; border-radius: 3px;
    }

    /* ===== PREMIUM COURSES ===== */
    .courses {
      padding: 10px 0 40px;
    }
    .courses-title {
      text-align: center;
      font-size: 1.55rem; font-weight: 600; font-style: italic;
      margin-bottom: 22px;
    }
    .courses-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px 8px;
      scrollbar-width: none;
    }
    .courses-scroll::-webkit-scrollbar { display: none; }
    .course {
      flex: 0 0 140px;
      text-align: center;
    }
    .course-img {
      width: 140px; height: 140px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      margin-bottom: 10px;
      border: 2px solid var(--border);
    }
    .course-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.95rem; font-weight: 600;
      margin-bottom: 2px;
    }
    .course-price {
      font-size: 0.78rem; color: var(--gold);
    }

    /* ===== RESTAURANTS ===== */
    .resto-section { padding: 0 20px 40px; }
    .section-label {
      font-size: 0.65rem; letter-spacing: 2.5px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 6px;
    }
    .section-h {
      font-size: 1.35rem; font-weight: 600; font-style: italic;
      margin-bottom: 18px;
    }
    .resto-card {
      background: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      cursor: pointer;
    }
    .resto-img {
      height: 150px;
      background-size: cover;
      background-position: center;
      position: relative;
    }
    .resto-img::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.65), transparent 55%);
    }
    .resto-badge {
      position: absolute; top: 10px; left: 10px; z-index: 2;
      background: rgba(0,0,0,0.7); color: var(--gold);
      border: 1px solid var(--border);
      padding: 3px 10px; font-size: 0.62rem;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .resto-info { padding: 12px 14px; }
    .resto-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.15rem; font-weight: 600; margin-bottom: 4px;
    }
    .resto-meta {
      font-size: 0.74rem; color: var(--text-muted);
      display: flex; flex-wrap: wrap; gap: 8px 12px;
    }

    /* Search + filters */
    .search-row {
      padding: 0 20px 12px;
    }
    .search-input {
      width: 100%; padding: 12px 16px;
      background: #111; border: 1px solid var(--border);
      border-radius: 6px; color: var(--text); font-size: 0.86rem;
      outline: none;
    }
    .search-input::placeholder { color: var(--text-muted); }
    .search-input:focus { border-color: var(--gold); }
    .filters {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 0 20px 20px; scrollbar-width: none;
    }
    .filters::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 7px 14px;
      border: 1px solid var(--border); background: transparent;
      color: var(--text-muted); font-size: 0.76rem;
      border-radius: 3px; cursor: pointer;
    }
    .chip.active { background: var(--gold); color: #0a0a0a; border-color: var(--gold); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(10,10,10,0.97);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 10px 0 12px; z-index: 90;
      max-width: 480px; margin: 0 auto;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      background: none; border: none; color: var(--text-muted);
      font-size: 0.58rem; letter-spacing: 0.4px; text-transform: uppercase;
      font-weight: 500; cursor: pointer;
    }
    .nav-item.active { color: var(--gold); }
    .nav-item svg { width: 20px; height: 20px; opacity: 0.55; }
    .nav-item.active svg { opacity: 1; }

    .toast {
      position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%);
      background: var(--bg-card); border: 1px solid var(--gold);
      color: var(--text); padding: 11px 22px; border-radius: 3px;
      font-size: 0.82rem; z-index: 300; opacity: 0; transition: opacity 0.3s;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div class="logo">Food<span>Go</span></div>
    <div class="header-right">
      <button class="h-btn" id="btnAccount">Account</button>
      <button class="h-btn" id="btnCart">Cart</button>
    </div>
  </header>

  <main id="app"></main>

  <nav class="bottom-nav">
    <button class="nav-item active" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg>
      Home
    </button>
    <button class="nav-item" data-view="cart">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      Cart
    </button>
    <button class="nav-item" data-view="orders">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
      Orders
    </button>
    <button class="nav-item" data-view="account">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Account
    </button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
    const RESTAURANTS = [
      { id:'r1', name:'Pizza Paradise', category:'Pizza', town:'Valletta', rating:4.8, deliveryFee:2.50, time:'25-35 min',
        img:'https://images.unsplash.com/photo-1513104890138-7c749659a591?w=800&h=500&fit=crop&q=85' },
      { id:'r2', name:'Burger Bay', category:'Burgers', town:'Sliema', rating:4.6, deliveryFee:2.00, time:'20-30 min',
        img:'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800&h=500&fit=crop&q=85' },
      { id:'r3', name:'Maltese Kitchen', category:'Maltese', town:'Birkirkara', rating:4.9, deliveryFee:2.80, time:'30-40 min',
        img:'https://images.unsplash.com/photo-1544025162-d766902fdf0a?w=800&h=500&fit=crop&q=85' },
      { id:'r4', name:'Sushi Wave', category:'Sushi', town:"St. Julian's", rating:4.7, deliveryFee:3.00, time:'25-40 min',
        img:'https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=800&h=500&fit=crop&q=85' },
      { id:'r5', name:'Healthy Bowls Co.', category:'Healthy', town:'Mosta', rating:4.5, deliveryFee:2.20, time:'20-30 min',
        img:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=800&h=500&fit=crop&q=85' },
      { id:'r6', name:'Sweet Treats', category:'Desserts', town:'Valletta', rating:4.8, deliveryFee:1.80, time:'15-25 min',
        img:'https://images.unsplash.com/photo-1551024506-0bccd828d307?w=800&h=500&fit=crop&q=85' }
    ];

    const COURSES = [
      { name: 'Pasta Primavera', price: 12.50, img: 'https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=400&h=400&fit=crop&q=85' },
      { name: 'Risotto Funghi', price: 14.00, img: 'https://images.unsplash.com/photo-1476124369491-e7addf5db371?w=400&h=400&fit=crop&q=85' },
      { name: 'Seafood Linguine', price: 16.50, img: 'https://images.unsplash.com/photo-1563379926898-05f4575a45d8?w=400&h=400&fit=crop&q=85' },
      { name: 'Truffle Tagliatelle', price: 18.00, img: 'https://images.unsplash.com/photo-1473093295043-cdd812d0e601?w=400&h=400&fit=crop&q=85' }
    ];

    const CATEGORIES = ['All','Pizza','Burgers','Maltese','Sushi','Healthy','Desserts'];
    let state = { view: 'home', filter: 'All', search: '' };

    function formatEUR(n) { return 'EUR ' + n.toFixed(2); }

    function render() {
      const app = document.getElementById('app');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.view === state.view));

      if (state.view !== 'home') {
        app.innerHTML = '<div style="padding:120px 24px;text-align:center;color:var(--text-muted)"><p>Coming next</p></div>';
        return;
      }

      const list = RESTAURANTS.filter(r => {
        const cat = state.filter === 'All' || r.category === state.filter;
        const q = !state.search || r.name.toLowerCase().includes(state.search.toLowerCase()) || r.category.toLowerCase().includes(state.search.toLowerCase());
        return cat && q;
      });

      app.innerHTML = `
        <!-- HERO: text + food image (like reference) -->
        <section class="hero">
          <div class="hero-left">
            <h1>Where Taste Meets<br>True Elegance</h1>
            <p>Exceptional dishes crafted with care, delivered from the finest kitchens across Malta.</p>
            <button class="btn-gold" id="btnExplore">Explore</button>
          </div>
          <div class="hero-right" style="background-image:url('https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=900&h=700&fit=crop&q=85')"></div>
        </section>

        <!-- FEATURED: steak section -->
        <section class="featured">
          <div class="feat-img" style="background-image:url('https://images.unsplash.com/photo-1546833999-b9f581a1996d?w=800&h=600&fit=crop&q=85')"></div>
          <div class="feat-text">
            <h2>Taverna Fresca<br>Seasonal Selection</h2>
            <p>Prime cuts and wood-fired specialties prepared with local herbs, citrus, and the finest island produce.</p>
            <button class="btn-outline">View Menu</button>
          </div>
        </section>

        <!-- PREMIUM COURSES - circular dishes like reference -->
        <section class="courses">
          <h2 class="courses-title">Premium Courses</h2>
          <div class="courses-scroll">
            ${COURSES.map(c => `
              <div class="course">
                <div class="course-img" style="background-image:url('${c.img}')"></div>
                <div class="course-name">${c.name}</div>
                <div class="course-price">${formatEUR(c.price)}</div>
              </div>
            `).join('')}
          </div>
        </section>

        <div class="search-row">
          <input class="search-input" id="searchInput" placeholder="Search restaurants..." value="${state.search}" />
        </div>
        <div class="filters">
          ${CATEGORIES.map(c => `<button class="chip ${state.filter===c?'active':''}" data-filter="${c}">${c}</button>`).join('')}
        </div>

        <section class="resto-section">
          <div class="section-label">Near You</div>
          <h2 class="section-h">Restaurants</h2>
          ${list.map(r => `
            <div class="resto-card" data-resto="${r.id}">
              <div class="resto-img" style="background-image:url('${r.img}')">
                <span class="resto-badge">${r.category}</span>
              </div>
              <div class="resto-info">
                <div class="resto-name">${r.name}</div>
                <div class="resto-meta">
                  <span>${r.rating} rating</span>
                  <span>${r.time}</span>
                  <span>${r.town}</span>
                  <span>${formatEUR(r.deliveryFee)} delivery</span>
                </div>
              </div>
            </div>
          `).join('')}
        </section>
      `;

      document.getElementById('searchInput').oninput = e => { state.search = e.target.value; render(); };
      document.querySelectorAll('[data-filter]').forEach(b => {
        b.onclick = () => { state.filter = b.dataset.filter; render(); };
      });
      document.getElementById('btnExplore')?.addEventListener('click', () => {
        document.querySelector('.courses')?.scrollIntoView({ behavior: 'smooth' });
      });
    }

    document.querySelectorAll('.nav-item').forEach(item => {
      item.onclick = () => { state.view = item.dataset.view; render(); };
    });
    document.getElementById('btnCart').onclick = () => { state.view = 'cart'; render(); };
    document.getElementById('btnAccount').onclick = () => { state.view = 'account'; render(); };

    render();
  </script>
</body>
</html>
