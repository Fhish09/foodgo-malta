<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Today's Menu — FoodGo Malta</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Petit+Formal+Script&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #120D0A; --bg-panel: #1A130E; --bg-card: #1E160F;
      --gold: #C9975A; --gold-light: #E8B778;
      --text: #F5EFE6; --text-body: #B5AB9E; --text-muted: #8A8078;
      --border: rgba(201,151,90,0.25); --border-soft: rgba(201,151,90,0.2);
      --icon-bg: rgba(201,151,90,0.12);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      -webkit-font-smoothing: antialiased; line-height: 1.5; min-height: 100vh;
    }
    h1, h2, h3 { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; }
    a { color: inherit; text-decoration: none; }
    header {
      position: sticky; top: 0; z-index: 50;
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(18,13,10,0.88); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-soft);
    }
    .logo {
      font-family: 'Playfair Display', serif; font-size: 1.35rem; font-weight: 700;
      display: flex; align-items: center; gap: 8px;
    }
    .logo span { color: var(--gold); }
    .logo-mark {
      width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--gold);
      display: flex; align-items: center; justify-content: center;
    }
    .logo-mark svg { width: 12px; height: 12px; stroke: var(--gold); fill: none; stroke-width: 1.8; }
    .nav-links { display: flex; gap: 24px; list-style: none; }
    .nav-links a { font-size: 0.82rem; font-weight: 500; color: var(--text-body); }
    .nav-links a:hover, .nav-links a.active { color: var(--gold); }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .cart-btn {
      position: relative; background: transparent; border: 1px solid var(--border);
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .cart-btn svg { width: 18px; height: 18px; stroke: var(--gold); fill: none; stroke-width: 1.8; }
    .cart-count {
      position: absolute; top: -4px; right: -4px;
      background: var(--gold); color: #14100C; font-size: 0.65rem; font-weight: 700;
      width: 18px; height: 18px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
    }
    .cart-count.show { display: flex; }
    .btn-gold {
      background: var(--gold); color: #14100C; border: none;
      height: 38px; padding: 0 18px; border-radius: 999px;
      font-size: 0.78rem; font-weight: 600; display: inline-flex; align-items: center;
    }
    .page-hero {
      padding: 40px 20px 24px; text-align: center;
      background: radial-gradient(ellipse at 50% 0%, rgba(201,151,90,0.12) 0%, transparent 55%);
    }
    .eyebrow { font-family: 'Petit Formal Script', cursive; color: var(--gold); font-size: 1.15rem; margin-bottom: 8px; }
    .page-hero h1 { font-size: clamp(1.8rem, 4vw, 2.4rem); margin-bottom: 8px; }
    .page-hero p { color: var(--text-body); font-size: 0.92rem; max-width: 460px; margin: 0 auto; }
    .day-badge {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 16px;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid var(--border); background: var(--icon-bg);
      font-size: 0.78rem; color: var(--gold); font-weight: 500;
    }
    .day-badge::before {
      content: ''; width: 8px; height: 8px; border-radius: 50%;
      background: #5dba6a; box-shadow: 0 0 8px rgba(93,186,106,0.6);
    }
    .filters {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
      padding: 8px 16px 24px;
    }
    .chip {
      background: transparent; border: 1px solid var(--border); color: var(--text-body);
      padding: 8px 14px; border-radius: 999px; font-size: 0.78rem; font-weight: 500;
      cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .chip:hover, .chip.active {
      border-color: var(--gold); color: var(--gold); background: rgba(201,151,90,0.1);
    }
    .menu-wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 64px; }
    .menu-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px;
    }
    .dish-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px;
      overflow: hidden; transition: transform 0.25s, box-shadow 0.25s, border-color 0.25s;
      display: flex; flex-direction: column;
    }
    .dish-card:hover {
      transform: translateY(-5px); box-shadow: 0 14px 28px rgba(0,0,0,0.4);
      border-color: rgba(201,151,90,0.4);
    }
    .dish-img {
      height: 168px; background-size: cover; background-position: center;
      background-color: #1a130e; position: relative;
      filter: saturate(1.06) contrast(1.05) brightness(0.96);
    }
    .dish-img::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 35%, rgba(18,13,10,0.82) 100%);
      pointer-events: none;
    }
    .dish-tag {
      position: absolute; top: 10px; left: 10px; z-index: 1;
      background: rgba(18,13,10,0.8); border: 1px solid var(--border);
      color: var(--gold); font-size: 0.68rem; font-weight: 600;
      padding: 4px 10px; border-radius: 999px;
    }
    .dish-body { padding: 14px 16px 16px; flex: 1; display: flex; flex-direction: column; }
    .dish-name { font-size: 1.02rem; font-weight: 600; margin-bottom: 4px; }
    .dish-rest { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .dish-desc {
      font-size: 0.8rem; color: var(--text-body); line-height: 1.45;
      margin-bottom: 14px; flex: 1;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .dish-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .dish-price { font-size: 1rem; font-weight: 600; color: var(--gold); }
    .dish-actions { display: flex; gap: 8px; }
    .btn-add {
      width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--gold);
      background: transparent; color: var(--gold); cursor: pointer; font-size: 1.15rem;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-add:hover { background: rgba(201,151,90,0.15); }
    .btn-order {
      background: var(--gold); color: #14100C; border: none;
      height: 36px; padding: 0 14px; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
    }
    .btn-order:hover { background: var(--gold-light); }
    .status { text-align: center; padding: 48px 20px; color: var(--text-muted); grid-column: 1 / -1; }
    .status.error { color: #e07070; }
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--bg-card); border: 1px solid var(--gold); color: var(--text);
      padding: 12px 22px; border-radius: 999px; font-size: 0.85rem; z-index: 200;
      opacity: 0; transition: all 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    footer {
      border-top: 1px solid var(--border-soft); padding: 24px; text-align: center;
      font-size: 0.78rem; color: var(--text-muted);
    }
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .menu-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
      .dish-img { height: 120px; }
    }
    @media (max-width: 420px) {
      .menu-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M3 12h18M12 3v18"/><circle cx="12" cy="12" r="3"/></svg></span>
      Food<span>Go</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html" class="active">Menu</a></li>
      <li><a href="checkout.html">Checkout</a></li>
    </ul>
    <div class="header-right">
      <a href="checkout.html" class="cart-btn" title="Cart">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </a>
      <a href="checkout.html" class="btn-gold">Checkout</a>
    </div>
  </header>

  <div class="page-hero">
    <div class="eyebrow">Fresh from Malta kitchens</div>
    <h1>Today's Menu</h1>
    <p>Dishes prepared today across our partner restaurants — order now and enjoy at home.</p>
    <div class="day-badge" id="dayBadge">Available today</div>
  </div>

  <div class="filters" id="filters">
    <button class="chip active" data-cat="">All</button>
  </div>

  <div class="menu-wrap">
    <div class="menu-grid" id="menuGrid">
      <div class="status">Loading today's dishes…</div>
    </div>
  </div>

  <footer>&copy; 2026 FoodGo Malta. All rights reserved.</footer>
  <div class="toast" id="toast"></div>

  <script src="food-images.js"></script>
  <script>
  (function () {
    if (!localStorage.getItem('foodgo_token')) {
      window.location.replace('login.html');
      return;
    }
    var API = (location.port === '8080') ? '/api' : 'http://localhost:4000/api';
    var allDishes = [];
    var cart = JSON.parse(localStorage.getItem('foodgo_cart') || '[]');

    var days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    var now = new Date();
    document.getElementById('dayBadge').textContent =
      'Available today · ' + days[now.getDay()] + ', ' + now.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' });

    function toast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(function () { el.classList.remove('show'); }, 2200);
    }

    function saveCart() {
      localStorage.setItem('foodgo_cart', JSON.stringify(cart));
      var n = cart.reduce(function (s, i) { return s + i.quantity; }, 0);
      var badge = document.getElementById('cartCount');
      badge.textContent = n;
      badge.classList.toggle('show', n > 0);
    }

    function formatEUR(n) { return '\u20AC' + Number(n).toFixed(2); }

    function addToCart(dish) {
      var existing = cart.find(function (c) { return c.menu_item_id === dish.id; });
      if (existing) existing.quantity += 1;
      else cart.push({
        menu_item_id: dish.id,
        name: dish.name,
        unit_price: dish.price,
        quantity: 1,
        restaurant_id: dish.restaurant_id,
        restaurant_name: dish.restaurant_name
      });
      saveCart();
      toast(dish.name + ' added to cart');
    }

    function orderNow(dish) {
      cart = [{
        menu_item_id: dish.id,
        name: dish.name,
        unit_price: dish.price,
        quantity: 1,
        restaurant_id: dish.restaurant_id,
        restaurant_name: dish.restaurant_name
      }];
      saveCart();
      window.location.href = 'checkout.html';
    }

    function render(list) {
      var grid = document.getElementById('menuGrid');
      if (!list.length) {
        grid.innerHTML = '<div class="status">No dishes match this filter.</div>';
        return;
      }
      grid.innerHTML = list.map(function (d) {
        var img = (typeof resolveFoodImage === 'function')
          ? resolveFoodImage(d.name, d.category || d.rest_category, 500)
          : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=500&h=300&fit=crop&q=80';
        return '<article class="dish-card">' +
          '<div class="dish-img" style="background-image:url(\'' + img + '\')">' +
            '<span class="dish-tag">' + (d.category || d.rest_category || 'Dish') + '</span>' +
          '</div>' +
          '<div class="dish-body">' +
            '<div class="dish-name">' + d.name + '</div>' +
            '<div class="dish-rest">' + d.restaurant_name + ' \u00B7 ' + (d.town || 'Malta') + '</div>' +
            '<div class="dish-desc">' + (d.description || '') + '</div>' +
            '<div class="dish-row">' +
              '<span class="dish-price">' + formatEUR(d.price) + '</span>' +
              '<div class="dish-actions">' +
                '<button class="btn-add" type="button" data-id="' + d.id + '" title="Add to cart">+</button>' +
                '<button class="btn-order" type="button" data-id="' + d.id + '">Order</button>' +
              '</div>' +
            '</div>' +
          '</div></article>';
      }).join('');

      grid.querySelectorAll('.btn-add').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var d = allDishes.find(function (x) { return x.id === btn.dataset.id; });
          if (d) addToCart(d);
        });
      });
      grid.querySelectorAll('.btn-order').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var d = allDishes.find(function (x) { return x.id === btn.dataset.id; });
          if (d) orderNow(d);
        });
      });
    }

    function buildFilters() {
      var cats = [];
      allDishes.forEach(function (d) {
        var c = d.rest_category || d.category;
        if (c && cats.indexOf(c) === -1) cats.push(c);
      });
      cats.sort();
      var row = document.getElementById('filters');
      row.innerHTML = '<button class="chip active" data-cat="">All</button>' +
        cats.map(function (c) {
          return '<button class="chip" data-cat="' + c + '">' + c + '</button>';
        }).join('');
      row.querySelectorAll('.chip').forEach(function (btn) {
        btn.addEventListener('click', function () {
          row.querySelectorAll('.chip').forEach(function (b) { b.classList.remove('active'); });
          btn.classList.add('active');
          var cat = btn.dataset.cat;
          render(cat ? allDishes.filter(function (d) {
            return d.rest_category === cat || d.category === cat;
          }) : allDishes);
        });
      });
    }

    async function init() {
      saveCart();
      var grid = document.getElementById('menuGrid');
      try {
        var res = await fetch(API + '/restaurants');
        if (!res.ok) throw new Error('API offline');
        var data = await res.json();
        var restaurants = data.restaurants || [];
        var dishes = [];
        for (var i = 0; i < restaurants.length; i++) {
          var r = restaurants[i];
          var mr = await fetch(API + '/restaurants/' + r.id);
          if (!mr.ok) continue;
          var md = await mr.json();
          (md.menu || []).forEach(function (item) {
            dishes.push({
              id: item.id,
              name: item.name,
              description: item.description,
              price: item.price,
              category: item.category,
              restaurant_id: r.id,
              restaurant_name: r.name,
              town: r.town,
              rest_category: r.category
            });
          });
        }
        allDishes = dishes;
        buildFilters();
        render(allDishes);
      } catch (e) {
        console.error(e);
        grid.innerHTML = '<div class="status error">Cannot load menu. Start the API: cd backend && npm run dev</div>';
      }
    }

    init();
  })();
  </script>
</body>
</html>
